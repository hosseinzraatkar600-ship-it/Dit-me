<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Date Invite ❤️</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>I have something to ask you... 💕</h1>

<p id="funText">
Will you go on a date with me?
</p>

<button id="yesBtn">
YES ❤️
</button>

<button id="noBtn">
NO 🙄
</button>


<div id="formBox" style="display:none;">

<h2>Choose the details 💕</h2>

<label>Which day can you come?</label>
<br>
<input type="date" id="day">

<br><br>

<label>What time works for you?</label>
<br>
<input type="time" id="time">

<br><br>

<label>Where would you like to go?</label>
<br>

<select id="place">
<option>Cafe ☕</option>
<option>Library 📚</option>
<option>Restaurant 🍽️</option>
<option>Walk 🚶</option>
<option>Cinema 🎬</option>
<option>Other ✨</option>
</select>

<br><br>

<button id="sendBtn">
DONE 💕
</button>

</div>


</div>


<script src="script.js"></script>

</body>
</html>
